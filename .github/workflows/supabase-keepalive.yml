name: Supabase Keepalive

# Supabase 무료 플랜은 일정 기간 API 요청이 전혀 없으면 프로젝트를 일시중지합니다.
# 일시중지된 뒤에는 API 요청으로 깨울 수 없고 대시보드에서 수동 복구해야 하므로,
# 중지되기 "전에" 주기적으로 요청을 보내는 것이 유일한 예방책입니다.
#
# 앱 내부 ping은 앱을 열어야만 동작하므로 보조 수단일 뿐입니다.
# 이 워크플로가 실제 방어선입니다.  설정법: KEEPALIVE.md

on:
  schedule:
    # 매일 1회 — UTC 18:13 = 한국시간 03:13
    # (GitHub 예약 실행은 부하에 따라 지연·누락될 수 있어 매일 실행으로 여유를 둡니다)
    - cron: '13 18 * * *'
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 없습니다. KEEPALIVE.md 참고."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          reached=0
          authfail=0

          for table in otp_monthly otp_settings; do
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                     --max-time 25 --retry 3 --retry-delay 5 --retry-all-errors \
                     -H "apikey: ${SUPABASE_ANON_KEY}" \
                     -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                     "${BASE}/rest/v1/${table}?select=*&limit=1") || code=000

            echo "${table} → HTTP ${code}"

            case "$code" in
              2*)
                reached=1
                ;;
              404)
                # 테이블이 없어도 요청은 프로젝트에 도달 → 활동으로 집계됨
                echo "::warning::${table} 테이블이 없습니다. 앱의 클라우드 탭에 있는 SQL을 실행하세요."
                reached=1
                ;;
              401|403)
                echo "::error::인증 거부(HTTP ${code}) — SUPABASE_ANON_KEY가 잘못되었거나 만료되었습니다."
                authfail=1
                ;;
              *)
                echo "응답 본문: $(head -c 400 /tmp/resp.txt 2>/dev/null)"
                ;;
            esac
          done

          if [ "$authfail" -eq 1 ]; then
            exit 1
          fi

          if [ "$reached" -ne 1 ]; then
            echo "::error::Supabase 프로젝트에 도달하지 못했습니다."
            echo "::error::이미 일시중지되었을 수 있습니다 — Supabase 대시보드에서 Restore 하세요."
            echo "마지막 응답 본문:"
            head -c 800 /tmp/resp.txt 2>/dev/null || true
            exit 1
          fi

          echo "✅ keepalive 성공 — $(date -u '+%Y-%m-%d %H:%M UTC')"
